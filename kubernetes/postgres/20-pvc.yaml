apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: devopsmart
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: devopsmart
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
