apiVersion: batch/v1
kind: Job
metadata:
  name: alembic-migrations
  namespace: devopsmart
  labels:
    app.kubernetes.io/name: alembic-migrations
    app.kubernetes.io/part-of: devopsmart
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alembic-migrations
        app.kubernetes.io/part-of: devopsmart
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: alembic
          image: devopsmart-db-backend:latest
          imagePullPolicy: Never
          workingDir: /app
          command:
            - alembic
            - upgrade
            - head
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
