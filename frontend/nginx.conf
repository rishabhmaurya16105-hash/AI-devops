server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Container liveness check (used by the Dockerfile HEALTHCHECK).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Same-origin API proxy. "backend" resolves through Docker's embedded DNS
    # once the frontend runs on a shared network (e.g. Docker Compose).
    # Using a variable defers DNS lookup so Nginx still starts without a backend.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed filenames here, so they can be cached long-term.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Never cache the HTML shell so new deployments are picked up immediately.
    location = /index.html {
        expires -1;
    }

    # SPA fallback: unknown paths return index.html instead of 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
