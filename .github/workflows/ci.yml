name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build and verify frontend image without publishing
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          image="devopsmart-db-frontend:${IMAGE_TAG}"
          if docker image inspect "$image" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing image tag: $image" >&2
            exit 1
          fi
          docker buildx build --pull --platform linux/amd64 --load \
            --tag "$image" --file Dockerfile.k8s .
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "101"
          test "$(docker image inspect --format '{{json .Config.ExposedPorts}}' "$image")" = '{"8080/tcp":{}}'
          docker run --rm --network none --entrypoint nginx "$image" -t
          docker run --rm --network none --entrypoint sh "$image" -ec \
            'test -s /usr/share/nginx/html/index.html && test -s /etc/nginx/conf.d/default.conf'

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install locked runtime dependencies
        run: python -m pip install -r requirements.lock

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Build and verify backend image without publishing
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          image="devopsmart-db-backend:${IMAGE_TAG}"
          if docker image inspect "$image" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing image tag: $image" >&2
            exit 1
          fi
          docker buildx build --pull --platform linux/amd64 --load \
            --tag "$image" --file Dockerfile .
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = "10001:10001"
          test "$(docker image inspect --format '{{json .Config.ExposedPorts}}' "$image")" = '{"8000/tcp":{}}'
          docker run --rm --network none --entrypoint python "$image" -c \
            'from pathlib import Path; import app.main; assert Path("app/main.py").is_file() and Path("migrations/env.py").is_file()'
